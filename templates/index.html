<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор тональности</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a1f;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .hidden {
            display: none !important;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        #text-input {
            flex: 1;
            background: #23232a;
            border: 1px solid #333340;
            border-radius: 10px;
            padding: 14px 16px;
            color: #e5e7eb;
            font-size: 16px;
            outline: none;
            transition: border-color 0.15s;
        }

        #text-input:focus {
            border-color: #5b8def;
        }

        #text-input::placeholder {
            color: #6b7280;
        }

        #ask-btn {
            background: #5b8def;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 26px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        #ask-btn:hover {
            background: #4a7cd8;
        }

        #ask-btn:disabled {
            background: #3a4a6b;
            cursor: wait;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .example-chip {
            background: #23232a;
            border: 1px solid #333340;
            border-radius: 20px;
            padding: 7px 14px;
            color: #b8bcc7;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .example-chip:hover {
            background: #2c2c35;
            color: #e5e7eb;
            border-color: #5b8def;
        }

        .result {
            background: #1e1e26;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 20px;
        }

        .result-label {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .result-verdict {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .result-verdict.positive {
            color: #4ade80;
        }

        .result-verdict.negative {
            color: #f87171;
        }

        .result-prob {
            color: #9ca3af;
            font-size: 15px;
            margin-left: 12px;
            font-weight: 400;
        }

        .confidence-bar {
            height: 6px;
            background: #2a2a35;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .confidence-fill {
            height: 100%;
            transition: width 0.4s ease;
        }

        .confidence-fill.positive {
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .confidence-fill.negative {
            background: linear-gradient(90deg, #dc2626, #f87171);
        }

        .history {
            margin-top: 32px;
        }

        .history-title {
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-clear {
            color: #6b7280;
            cursor: pointer;
            font-size: 12px;
            text-transform: none;
            letter-spacing: 0;
        }

        .history-clear:hover {
            color: #f87171;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #1e1e26;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .history-text {
            color: #d1d5db;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 12px;
        }

        .history-verdict {
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .history-verdict.positive {
            color: #4ade80;
        }

        .history-verdict.negative {
            color: #f87171;
        }

        .error {
            background: #2a1a1a;
            border: 1px solid #5a2a2a;
            border-radius: 10px;
            padding: 12px 16px;
            color: #f87171;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .empty-history {
            color: #4b5563;
            font-size: 13px;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Анализатор тональности</h1>
        <p class="subtitle">Введите фразу — модель скажет: позитив или негатив.</p>

        <div class="input-row">
            <input
                type="text"
                id="text-input"
                placeholder="Этот фильм просто отличный..."
                autocomplete="off"
            >
            <button id="ask-btn">Спросить</button>
        </div>

        <div class="examples">
            <span class="example-chip">Отличный сервис, всё быстро!</span>
            <span class="example-chip">Ужасная еда, больше не приду</span>
            <span class="example-chip">Нормально, но ничего особенного</span>
            <span class="example-chip">Обожаю этот ресторан</span>
        </div>

        <div id="result" class="result hidden">
            <div class="result-label">Результат</div>
            <div>
                <span id="verdict" class="result-verdict"></span>
                <span id="prob" class="result-prob"></span>
            </div>
            <div class="confidence-bar">
                <div id="confidence" class="confidence-fill"></div>
            </div>
        </div>

        <div id="error" class="error hidden"></div>

        <div class="history">
            <div class="history-title">
                <span>История</span>
                <span class="history-clear" id="history-clear">Очистить</span>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('text-input');
        const askBtn = document.getElementById('ask-btn');
        const resultBox = document.getElementById('result');
        const verdictEl = document.getElementById('verdict');
        const probEl = document.getElementById('prob');
        const confidenceEl = document.getElementById('confidence');
        const errorBox = document.getElementById('error');
        const historyList = document.getElementById('history-list');
        const historyClear = document.getElementById('history-clear');
        const exampleChips = document.querySelectorAll('.example-chip');

        const HISTORY_KEY = 'sentiment_history';

        // ---------- История ----------
        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            } catch {
                return [];
            }
        }

        function saveHistory(items) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 20)));
        }

        function renderHistory() {
            const items = loadHistory();
            historyList.innerHTML = '';
            if (items.length === 0) {
                // Используем новый CSS-класс вместо инлайн-стилей
                historyList.innerHTML = '<div class="empty-history">Пока пусто</div>';
                return;
            }
            for (const item of items) {
                const div = document.createElement('div');
                div.className = 'history-item';
                const verdictClass = item.label === 1 ? 'positive' : 'negative';
                const verdictText = item.label === 1 ? 'ПОЗИТИВ' : 'НЕГАТИВ';
                div.innerHTML = `
                    <span class="history-text">${escapeHtml(item.text)}</span>
                    <span class="history-verdict ${verdictClass}">${verdictText}</span>
                `;
                historyList.appendChild(div);
            }
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        historyClear.addEventListener('click', () => {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        });

        // ---------- Отправка запроса ----------
        async function ask(text) {
            text = text.trim();
            if (!text) return;

            errorBox.classList.add('hidden');
            askBtn.disabled = true;
            askBtn.textContent = 'Думаю...';

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });

                if (!res.ok) {
                    throw new Error('Ошибка сервера: ' + res.status);
                }

                const data = await res.json();

                const isPositive = data.label === 1;
                const probPct = (data.prob * 100).toFixed(1);

                verdictEl.textContent = isPositive ? 'ПОЗИТИВ' : 'НЕГАТИВ';
                verdictEl.className = 'result-verdict ' + (isPositive ? 'positive' : 'negative');

                probEl.textContent = `уверенность ${probPct}%`;

                const confidenceValue = isPositive ? data.prob : 1 - data.prob;
                confidenceEl.style.width = (confidenceValue * 100) + '%';
                confidenceEl.className = 'confidence-fill ' + (isPositive ? 'positive' : 'negative');

                resultBox.classList.remove('hidden');

                const items = loadHistory();
                items.unshift({ text: data.text, label: data.label });
                saveHistory(items);
                renderHistory();

            } catch (err) {
                console.error("Fetch error:", err);
                
                errorBox.textContent = 'Не удалось связаться с сервером. Проверьте, запущен ли Python-сервер.';
                errorBox.classList.remove('hidden');
            } finally {
                askBtn.disabled = false;
                askBtn.textContent = 'Спросить';
            }
        }

        // ---------- События ----------
        askBtn.addEventListener('click', () => ask(input.value));

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ask(input.value);
        });

        exampleChips.forEach(chip => {
            chip.addEventListener('click', () => {
                input.value = chip.textContent;
                input.focus();
            });
        });

        // ---------- Инициализация ----------
        renderHistory();
    </script>
</body>
</html>
